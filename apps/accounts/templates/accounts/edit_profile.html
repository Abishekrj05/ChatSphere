{% extends "base.html" %}
{% block title %}Edit Profile | ChatSphere{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Edit profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="primary-button" type="submit">Save changes</button>
    </form>
</section>
{% endblock %}
